name: Build and release DailyPlan for Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select package version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { $env:GITHUB_REF_NAME.Substring(1) } else { "1.1.0-dev.$env:GITHUB_RUN_NUMBER" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Verify update states and recovery
        shell: pwsh
        run: dotnet run --project Tests/DailyPlan.UpdaterVerification.csproj -c Release
      - name: Build installer, portable app and update feed
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $previous = $env:GITHUB_REF.StartsWith('refs/tags/v')
          ./Package-Windows.ps1 -Version $env:PACKAGE_VERSION -FetchPrevious:$previous
      - name: Upload complete release files
        uses: actions/upload-artifact@v4
        with:
          name: DailyPlan-Windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DailyPlan-Windows-x64
          path: dist
      - name: Publish version with complete portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "DailyPlan $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
